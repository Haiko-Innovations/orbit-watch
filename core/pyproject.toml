[project]
name = "orbit-watch"
version = "0.1.0"
description = "Open protocol and reference implementation for requesting, verifying and settling satellite observations (working name). Phase 0: observation format, simulator, verification engine and station quality meter."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Orbit Watch contributors" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "jsonschema>=4.26",
    "numpy>=2.0",
    "sgp4>=2.27",
    "skyfield>=1.55",
]

[project.urls]
Homepage = "https://github.com/Haiko-Innovations/orbit-watch"
Issues = "https://github.com/Haiko-Innovations/orbit-watch/issues"

[project.scripts]
orbit-watch = "orbit_watch.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.10",
    "pytest>=9.2",
    "ruff>=0.17",
]
# Locked so that CI can build the package from hash-checked requirements.
build = ["hatchling>=1.33"]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_watch"]

[tool.uv]
# Supply-chain guard, same idea as the Dependabot cooldown: only resolve
# package files that have been public for at least 14 days.
exclude-newer = "14 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Skyfield 1.55 sets an array dtype in searchlib.py, which NumPy 2.5 deprecates.
    # Harmless for now; remove once Skyfield is updated.
    "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:skyfield.searchlib",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Arcminute and arcsecond signs are intended in report texts.
allowed-confusables = ["′", "″"]
