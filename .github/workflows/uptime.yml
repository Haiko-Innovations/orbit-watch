name: Uptime

# A check of the public service from outside, every hour (phase 4, step 4.6; decision
# D-39): the API, the follower, which falls behind when the schedule or the database
# stops, and the web application. A failed run opens an issue assigned to the maintainer
# (the repository variable ALERT_ASSIGNEE), and the next run that passes closes it.

on:
  schedule:
    # At 17 minutes past every hour: just after the follower's run at :15, while the
    # database is still awake, so the check costs Neon nothing extra (D-39).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      fail:
        description: "Fail on purpose, to check that the alert reaches the maintainer"
        type: boolean
        default: false

# Least privilege: the job reads nothing from the repository, and writes only its alert.
permissions:
  contents: read
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVICE: https://orbit-watch-tan.vercel.app
    steps:
      - name: The API, the follower and the web application answer
        env:
          FAIL_ON_PURPOSE: ${{ inputs.fail }}
        run: |
          set -euo pipefail
          if [ "${FAIL_ON_PURPOSE}" = "true" ]; then
            echo "::error::failing on purpose, to check that the alert reaches the maintainer"
            exit 1
          fi
          check() {
            curl --fail-with-body --silent --show-error --max-time 60 \
              --retry 2 --retry-delay 20 --retry-all-errors "$@"
            echo
          }
          check "${SERVICE}/v1/health"
          check "${SERVICE}/v1/health/follower"
          check --output /dev/null "${SERVICE}/"
          echo "Answered at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_STEP_SUMMARY}"

      # The alert (D-39): an issue assigned to the maintainer, which reaches them like
      # everything else they follow on GitHub. One open issue at a time; the next run that
      # passes closes it.
      - name: Alert the maintainer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$(gh issue list --label "alert: uptime" --state open --json number --jq '.[].number')" ]; then
            echo "An alert is already open."
            exit 0
          fi
          gh issue create --label "alert: uptime" --assignee "${ASSIGNEE}" --title "Alert: the public service does not answer" \
            --body "${RUN} failed. What to do: docs/operations.md#the-uptime-check-failed. The next run that passes closes this issue."

      - name: Close the alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --label "alert: uptime" --state open --json number --jq '.[].number'); do
            gh issue close "${number}" --comment "Passed again: ${RUN}"
          done
