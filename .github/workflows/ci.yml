name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the required status check in the main ruleset.
  tarkistus:
    runs-on: ubuntu-latest
    # About 16 minutes with the cache of real element sets; filling it from scratch adds
    # about 8, since SatChecker is asked two seconds apart.
    timeout-minutes: 30
    # PostgreSQL for the service's tests and the local stack (decision P4-04): the same image
    # as core/tests/postgres.py (a test keeps them equal), on 127.0.0.1 only, trust
    # authentication, nothing worth protecting. Every test gets a schema of its own.
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Use only the interpreters installed by setup-python.
      UV_PYTHON_DOWNLOADS: never
      ORBIT_WATCH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ORBIT_WATCH_PG_TESTS: "1"
    defaults:
      run:
        working-directory: core
    steps:
      # Actions are pinned to commit SHAs (supply-chain protection). Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
          submodules: true # contracts/lib: forge-std and OpenZeppelin, pinned to release commits

      - name: Secrets (gitleaks)
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner

      # Oldest and newest supported Python. The last one listed is the default.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.15
            3.12

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"

      - name: Lint and formatting (ruff)
        run: |
          uv run --locked --python 3.12 ruff check .
          uv run --locked --python 3.12 ruff format --check .

      # Real element sets for the tests that need them (phase 5, step 5.1; decision P5-05).
      # They are kept in GitHub Actions' cache only, never in the repository or an artifact
      # (D-06). SatChecker is asked only for what the cache lacks, two seconds apart, and
      # fetching stops at the first answer that is not 200. If SatChecker cannot be asked,
      # those tests are skipped, and a warning says so. When a manifest changes, the older
      # cache is restored, so that only the sets it lacks are asked for. The cache is saved
      # right after fetching, so that a later step that fails or runs out of time does not
      # make the next run ask SatChecker again.
      - id: orbits
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orbit-watch
          key: reference-orbits-${{ hashFiles('core/tests/data/reference-orbits.json', 'examples/real/reference-orbits.json', 'validation/real/reference-orbits.json') }}
          restore-keys: reference-orbits-

      - name: Real reference orbits (fetched only when the cache lacks them)
        run: |
          for manifest in tests/data/reference-orbits.json ../examples/real/reference-orbits.json ../validation/real/reference-orbits.json; do
            uv run --locked --python 3.12 orbit-watch fetch-orbits "$manifest" \
              || { echo "::warning::SatChecker could not be asked: the tests of real reference orbits are skipped"; break; }
            sleep 2  # SatChecker is asked two seconds apart (P5-03)
          done

      - if: steps.orbits.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orbit-watch
          key: ${{ steps.orbits.outputs.cache-primary-key }}

      # One BLAS thread: the tests' arrays are small, and with threads the measurement on
      # real data (step 5.3) took 17 times the processor time for the same results.
      - name: Tests (Python 3.12)
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: uv run --locked --python 3.12 pytest

      - name: Tests (Python 3.15)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-3.15
          OPENBLAS_NUM_THREADS: "1"
        run: uv run --locked --python 3.15 pytest

      # The README promises that a plain `pip install` works. Install exactly the
      # locked, hash-checked dependencies and build without fetching anything else.
      - name: Plain pip install
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uv export --locked --only-group build --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/build-requirements.txt"
          python3.12 -m venv "$RUNNER_TEMP/pip-venv"
          pip="$RUNNER_TEMP/pip-venv/bin/pip"
          "$pip" install --require-hashes -r "$RUNNER_TEMP/requirements.txt" \
            -r "$RUNNER_TEMP/build-requirements.txt"
          "$pip" install --no-deps --no-build-isolation .
          "$RUNNER_TEMP/pip-venv/bin/orbit-watch" --version
          "$RUNNER_TEMP/pip-venv/bin/orbit-watch" demo --out "$RUNNER_TEMP/demo-pip"
          "$RUNNER_TEMP/pip-venv/bin/orbit-watch" demo --phase 1 --out "$RUNNER_TEMP/demo1-pip"

      # Same input, byte-identical output: both demos (phase 0 datasets and
      # reports, phase 1 request chain) must match the committed examples on
      # both Python versions and from a plain pip install.
      - name: Determinism across Python versions
        env:
          UV_PROJECT_ENVIRONMENT: .venv-3.15
        run: |
          uv run --locked --python 3.15 orbit-watch demo --out "$RUNNER_TEMP/demo-3.15"
          uv run --locked --python 3.15 orbit-watch demo --phase 1 --out "$RUNNER_TEMP/demo1-3.15"
          diff -r ../examples/simulated "$RUNNER_TEMP/demo-pip"
          diff -r ../examples/simulated "$RUNNER_TEMP/demo-3.15"
          diff -r ../examples/phase1 "$RUNNER_TEMP/demo1-pip"
          diff -r ../examples/phase1 "$RUNNER_TEMP/demo1-3.15"

      # Contracts (phase 2). Foundry pinned to a release older than 14 days (decision P2-04).
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6

      - name: Contracts (format, lint, build, tests with fuzzing and invariants)
        working-directory: contracts
        run: |
          forge fmt --check
          forge lint --deny warnings
          forge build --sizes
          forge test

      # On a local Anvil chain: the evm-testnet settlement adapter with the phase 1
      # settlement scenario suite (step 2.5), the service, API and command line with
      # every party signing its own transactions (step 2.6), the deployment script run
      # with forge script (step 2.7), the phase 2 demo (step 2.8), signing in with a
      # wallet (step 3.2), the administrator view with the reviewer registry's Safe and
      # timelock (step 3.7), two services following one escrow from one database
      # (step 4.2) and the dedicated RPC endpoint whose key never shows (step 4.3). Needs
      # the build above. Never touches a public network and holds no keys
      # but local test keys (P2-08).
      - name: Settlement adapter, service, command line, deployment, demo, sign-in, administration, follower and RPC endpoint on a local chain (Anvil)
        env:
          ORBIT_WATCH_EVM_TESTS: "1"
        run: >-
          uv run --locked --python 3.12 pytest tests/test_evm_adapter.py tests/test_chain.py
          tests/test_chain_service.py tests/test_cli_chain.py tests/test_deploy_script.py
          tests/test_phase2_demo.py tests/test_sessions.py tests/test_admin.py
          tests/test_follower.py tests/test_rpc.py

      # The web application (phase 3). Node from the Active LTS line (decision P3-02);
      # `npm ci` installs exactly the lock file, and no package runs an install script.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web application (Biome, type check, unit tests, build)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run typecheck
          npm test
          npm run build

      # The built app against the local stack (step 3.1): a local Anvil chain with the
      # contracts built above, the service and SIMULATED parties, with accessibility
      # checks in light and dark colours. Never touches a public network (P3-08).
      - name: Web application end to end (Playwright and axe, local chain)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      # The service as a container image (step 4.2, decision P4-05): built from the
      # Dockerfile at the root, then the same end-to-end tests against it. The local stack
      # seeds the database and hands it over to the image, which serves the API and its own
      # build of the web application, as an ordinary user on a read-only file system.
      - name: Service image (build, and the end-to-end tests against it)
        working-directory: .
        run: |
          docker build --tag orbit-watch:ci .
          cd web
          ORBIT_WATCH_E2E_IMAGE=orbit-watch:ci npm run e2e

      - name: Known vulnerabilities (runtime dependencies, including the API and EVM extras)
        run: |
          uv export --locked --no-dev --all-extras --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements-all.txt"
          uv run --locked --python 3.12 pip-audit --disable-pip --require-hashes --strict \
            -r "$RUNNER_TEMP/requirements-all.txt"

      - name: Known vulnerabilities (the web application's runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev
