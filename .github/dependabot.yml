version: 2
# contracts/lib (forge-std, OpenZeppelin, eas-contracts) are git submodules pinned to release
# commits. They are not listed here on purpose: Dependabot would move them to the
# newest commit of the default branch, which is not a release. They are updated by
# hand, see contracts/README.md (decision D-18).
updates:
  # New versions wait 14 days before they are proposed (supply-chain protection:
  # a compromised release is usually detected and pulled within that time).
  # Security updates do not wait: the cooldown does not apply to them.
  # core/pyproject.toml also sets uv's exclude-newer to 14 days, so the lock file
  # follows the same rule.
  - package-ecosystem: uv
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  # The web application (decision P3-02). web/.npmrc also sets npm's
  # min-release-age to 14 days, so dependencies of dependencies follow the same rule.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
  # The service image's base images (Dockerfile, step 4.2), pinned by digest. The uv
  # image is updated by hand, with the uv version that CI installs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    # The image runs the oldest supported Python, as CI's end-to-end tests do, and the
    # web application's Node line (web/.nvmrc); core/tests/test_image.py checks both.
    # Those move by hand, with the project's supported versions.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
