# Orbit Watch contracts (phase 2). Decisions P2-04 and D-18.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
# Base Sepolia has had Ethereum's Dencun changes since 2024-02-21 (Ecotone).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Warnings from pinned libraries (for example OpenZeppelin's EnumerableSet.at, which
# solc 0.8.38 flags because "at" may become a keyword); our own code still warns.
ignored_warnings_from = ["lib/"]
# The settlement scenario suite exported from the Python core (test/fixtures); the
# deployment settings and records (deployments/, written by script/DeployOrbitWatch.s.sol).
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "eas-contracts/=lib/eas-contracts/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
